apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kuapa-dwaso-staging

resources:
  - ../../base
  - namespace.yaml

patches:
  - target:
      group: secrets.infisical.com
      version: v1beta1
      kind: InfisicalAuth
      name: kuapa-dwaso-infisical
    patch: |-
      - op: replace
        path: /spec/infisicalConnectionRef/namespace
        value: kuapa-dwaso-staging
      - op: replace
        path: /spec/universal/clientIdRef/namespace
        value: kuapa-dwaso-staging
      - op: replace
        path: /spec/universal/clientSecretRef/namespace
        value: kuapa-dwaso-staging
  - target:
      group: secrets.infisical.com
      version: v1beta1
      kind: InfisicalStaticSecret
      name: kuapa-dwaso-runtime
    patch: |-
      - op: replace
        path: /spec/infisicalAuthRef/namespace
        value: kuapa-dwaso-staging
      - op: replace
        path: /spec/sources/0/projectId
        value: 1b3b07fb-3a1e-472b-be1c-8a21557f77b9
      - op: replace
        path: /spec/sources/0/environmentSlug
        value: staging
      - op: replace
        path: /spec/targets/0/namespace
        value: kuapa-dwaso-staging
      - op: replace
        path: /spec/targets/1/namespace
        value: kuapa-dwaso-staging

images:
  - name: kuapa-dwaso/www
    newName: kuapa-dwaso/www
    newTag: staging
  - name: kuapa-dwaso/app
    newName: kuapa-dwaso/app
    newTag: staging
  - name: kuapa-dwaso/admin
    newName: kuapa-dwaso/admin
    newTag: staging
  - name: kuapa-dwaso/ops
    newName: kuapa-dwaso/ops
    newTag: staging
  - name: kuapa-dwaso/api
    newName: kuapa-dwaso/api
    newTag: staging
