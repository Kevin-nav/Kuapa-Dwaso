apiVersion: batch/v1
kind: CronJob
metadata:
  name: notification-delivery
  labels:
    app.kubernetes.io/name: notification-delivery
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: notification-delivery
        spec:
          restartPolicy: OnFailure
          containers:
            - name: notification-delivery
              image: curlimages/curl:8.15.0
              args:
                - --fail-with-body
                - --silent
                - --show-error
                - --request
                - POST
                - --header
                - "x-notification-delivery-secret: $(NOTIFICATION_DELIVERY_SECRET)"
                - http://api:4000/sms/webhooks/deliveries/process
              env:
                - name: NOTIFICATION_DELIVERY_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: kuapa-dwaso-runtime
                      key: NOTIFICATION_DELIVERY_SECRET
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
            - name: web-push-delivery
              image: curlimages/curl:8.15.0
              args:
                - --fail-with-body
                - --silent
                - --show-error
                - --request
                - POST
                - --header
                - "x-notification-delivery-secret: $(NOTIFICATION_DELIVERY_SECRET)"
                - http://api:4000/notifications/deliveries/process
              env:
                - name: NOTIFICATION_DELIVERY_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: kuapa-dwaso-runtime
                      key: NOTIFICATION_DELIVERY_SECRET
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
