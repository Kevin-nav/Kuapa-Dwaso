apiVersion: apps/v1
kind: Deployment
metadata:
  name: www
  labels:
    app.kubernetes.io/name: www
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: www
  template:
    metadata:
      labels:
        app.kubernetes.io/name: www
    spec:
      containers:
        - name: www
          image: kuapa-dwaso/www:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            - cd apps/www && corepack pnpm exec next start -H 0.0.0.0 -p ${PORT:-3000}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          envFrom:
            - secretRef:
                name: kuapa-dwaso-runtime
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: www
  labels:
    app.kubernetes.io/name: www
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: www
  ports:
    - name: http
      port: 3000
      targetPort: http
---
