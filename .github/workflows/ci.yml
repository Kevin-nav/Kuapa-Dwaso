name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - production

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: corepack pnpm typecheck

      - name: Lint workspace
        run: corepack pnpm lint

      - name: Test packages and apps
        run: corepack pnpm test

      - name: Test API
        run: corepack pnpm --filter @kuapa-dwaso/api test

      - name: Run provider doctor in safe dev mode
        run: corepack pnpm provider:doctor -- --mode=dev
