name: Build and Publish Images

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to use for build-time public values.
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish ${{ matrix.surface.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'production' && 'production' || 'staging') }}
    env:
      FIREBASE_AUTH_ORIGINS: https://app.kuapadwaso.com,https://ops.kuapadwaso.com,https://admin.kuapadwaso.com

    strategy:
      fail-fast: false
      matrix:
        surface:
          - name: www
            package: "@kuapa-dwaso/www"
            start_command: "cd apps/www && corepack pnpm exec next start -H 0.0.0.0 -p ${PORT:-3000}"
          - name: app
            package: "@kuapa-dwaso/app"
            start_command: "cd apps/app && corepack pnpm exec next start -H 0.0.0.0 -p ${PORT:-3000}"
          - name: admin
            package: "@kuapa-dwaso/admin"
            start_command: "cd apps/admin && corepack pnpm exec next start -H 0.0.0.0 -p ${PORT:-3000}"
          - name: ops
            package: "@kuapa-dwaso/ops"
            start_command: "cd apps/ops && corepack pnpm exec next start -H 0.0.0.0 -p ${PORT:-3000}"
          - name: api
            package: "@kuapa-dwaso/api"
            start_command: "node apps/api/dist/main.js"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set image names
        id: image
        shell: bash
        run: |
          registry="${IMAGE_REGISTRY:-ghcr.io}"
          repo="${IMAGE_REPOSITORY_PREFIX:-$registry/${GITHUB_REPOSITORY,,}}"
          image="$repo/${{ matrix.surface.name }}"
          short_sha="${GITHUB_SHA::12}"
          branch_tag="${GITHUB_REF_NAME//\//-}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-$short_sha" >> "$GITHUB_OUTPUT"
          echo "branch_tag=$branch_tag" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          IMAGE_REPOSITORY_PREFIX: ${{ vars.IMAGE_REPOSITORY_PREFIX }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Infisical CLI
        shell: bash
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get update
          sudo apt-get install -y infisical

      - name: Export build-time public values from Infisical
        shell: bash
        run: |
          INFISICAL_ENVIRONMENT_SLUG="${INFISICAL_ENVIRONMENT_SLUG:-$BUILD_ENVIRONMENT}"
          INFISICAL_SECRET_PATH="${INFISICAL_SECRET_PATH:-/}"

          INFISICAL_TOKEN="$(infisical login --method=universal-auth --client-id="$INFISICAL_CLIENT_ID" --client-secret="$INFISICAL_CLIENT_SECRET" --plain --silent)"
          export INFISICAL_TOKEN
          infisical export --projectId="$INFISICAL_PROJECT_ID" --env="$INFISICAL_ENVIRONMENT_SLUG" --path="$INFISICAL_SECRET_PATH" --format=dotenv > infisical-build.env

          set -a
          # shellcheck disable=SC1091
          source infisical-build.env
          set +a

          required_keys=(
            NEXT_PUBLIC_CONVEX_URL
            NEXT_PUBLIC_API_URL
            NEXT_PUBLIC_FIREBASE_API_KEY
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
            NEXT_PUBLIC_FIREBASE_PROJECT_ID
            NEXT_PUBLIC_FIREBASE_APP_ID
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
          )

          for key in "${required_keys[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              echo "$key must be present in Infisical for $INFISICAL_ENVIRONMENT_SLUG." >&2
              exit 1
            fi
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done

          rm -f infisical-build.env
        env:
          BUILD_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'production' && 'production' || 'staging') }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
          INFISICAL_ENVIRONMENT_SLUG: ${{ vars.INFISICAL_ENVIRONMENT_SLUG }}
          INFISICAL_SECRET_PATH: ${{ vars.INFISICAL_SECRET_PATH || '/' }}

      - name: Verify Firebase authorized domains
        shell: bash
        run: node packages/test-utils/src/check-firebase-auth-domains.mjs

      - name: Log in to GHCR
        if: ${{ (vars.IMAGE_REGISTRY == '' || vars.IMAGE_REGISTRY == 'ghcr.io') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/kuapa-surface.Dockerfile
          push: true
          build-args: |
            PACKAGE_NAME=${{ matrix.surface.package }}
            NEXT_PUBLIC_CONVEX_URL=${{ env.NEXT_PUBLIC_CONVEX_URL }}
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ env.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ env.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ env.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ env.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ env.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ env.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            START_COMMAND=${{ matrix.surface.start_command }}
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.image.outputs.sha_tag }}
            ${{ steps.image.outputs.image }}:${{ steps.image.outputs.branch_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            kuapa-dwaso.surface=${{ matrix.surface.name }}
          target: runtime
